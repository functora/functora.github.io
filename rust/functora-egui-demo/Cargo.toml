[package]
name = "functora-egui-demo"
version = "0.1.0"
edition = "2024"
description = "Showcase app for functora-egui - all layouts, components, widgets and features"
license = "MIT"
repository = "https://github.com/functora/functora.github.io/tree/master/rust/functora-egui-demo"
documentation = "https://docs.rs/functora-egui-demo"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "x11",
    "wayland",
    "android-game-activity",
] }
egui = "0.36.1"
functora-egui = { path = "../functora-egui", features = ["web", "android", "qr", "camera"] }
log = "0.4"
poll-promise = "0.3"
pollster = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Location", "Window"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["game-activity"] }
jni = "0.21.1"
winit = { version = "0.30.13", default-features = false, features = [
    "android-game-activity",
] }

[package.metadata.functora-egui-web]
title = "functora-egui Showcase"
short_name = "functora-egui"
theme_color = "#0a0a0a"

[package.metadata.functora-egui-android]
host = "functora.github.io"
path_prefix = "/apps/functora-egui-demo/"

[build-dependencies]
askama = "0.12"
functora-egui = { path = "../functora-egui", features = ["build"] }
toml = "0.8"

[patch.crates-io]
egui-winit = { path = "../egui-winit" }

[lints.rust]
unused_results = "warn"
[lints.clippy]
pedantic = "warn"
# strict
or_fun_call = "warn"
must_use_unit = "warn"
ignored_unit_patterns = "warn"
let_underscore_must_use = "warn"
map_unwrap_or = "warn"
unwrap_used = "warn"
expect_used = "warn"
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
# relaxed
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }