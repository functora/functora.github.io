[package]
name = "cryptonote"
license = "MIT"
version = "0.1.10"
authors = ["Functora <functora@proton.me>"]
edition = "2021"

[dependencies]
dioxus = { version = "=0.7.2", features = ["html", "router"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
derive_more = { version = "2.1.0", features = ["display"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Event", "HtmlInputElement", "Window"] }
thiserror = "2.0.18"
tracing = "0.1.43"
functora = "0.1.1"
functora-dioxus = { path = "../functora-dioxus", features = ["qr"] }
functora-tagged = "0.2.7"
dioxus-free-icons = { version = "0.10.0", features = [
  "font-awesome-brands",
  "font-awesome-solid",
] }
dioxus-sdk = { version = "0.7.0", features = ["storage"] }
tap = "1.0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
dioxus = { version = "=0.7.2", features = ["html", "router"] }
dioxus-core = "=0.7.2"
dioxus-signals = "=0.7.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rxing = { version = "0.9.0", default-features = false, features = [
  "wasm_support",
  "encoding_rs",
  "decoders",
  "encoders",
  "qrcode",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
