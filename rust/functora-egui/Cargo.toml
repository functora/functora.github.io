[package]
name = "functora-egui"
version = "0.1.0"
edition = "2024"
description = "shadcn/ui-inspired widget library for egui - buttons, inputs, selects, dialogs, and 50+ more components with light/dark theming"
license = "MIT"
keywords = ["egui", "ui", "widgets", "shadcn", "gui"]
categories = ["gui", "rendering"]
repository = "https://github.com/functora/functora.github.io/tree/master/rust/functora-egui"
documentation = "https://docs.rs/functora-egui"

[dependencies]
egui = "0.36.1"
egui_flex = "0.8"
log = "0.4"
num-traits = "0.2"
functora-core = { path = "../functora-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
directories = "6.0"
urlencoding = "2.1.3"
tracing = "0.1.43"
zeroize = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies.eframe]
version = "0.36.1"
optional = true
default-features = false
features = ["default_fonts", "glow"]

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2.127"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
optional = true
features = [
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlVideoElement",
  "HtmlInputElement",
  "HtmlAnchorElement",
  "CanvasRenderingContext2d",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "FileReader",
  "FileList",
  "File",
  "Location",
  "VisualViewport",
  "Window",
  "Navigator",
  "Storage",
  "MediaDevices",
  "MediaStream",
  "MediaStreamTrack",
  "MediaStreamConstraints",
  "ImageData",
  "Clipboard",
  "ShareData",
  "Event",
  "EventTarget",
  "AddEventListenerOptions",
  "HtmlElement",
]

[target.'cfg(target_arch = "wasm32")'.dependencies.gloo-timers]
version = "0.3"
features = ["futures"]

[target.'cfg(target_arch = "wasm32")'.dependencies.js-sys]
version = "0.3"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies.arboard]
version = "3.4"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies.rfd]
version = "0.15"

[target.'cfg(target_os = "android")'.dependencies.eframe]
version = "0.36.1"
optional = true
default-features = false
features = ["default_fonts", "glow"]

[target.'cfg(target_os = "android")'.dependencies.android-activity]
version = "0.6.1"
optional = true
features = ["game-activity"]

[target.'cfg(target_os = "android")'.dependencies.jni]
version = "0.21.1"
optional = true

[target.'cfg(target_os = "android")'.dependencies.winit]
version = "0.30.13"
optional = true
default-features = false
features = ["android-game-activity"]

[dependencies.askama]
version = "0.12"
optional = true

[dependencies.toml]
version = "0.8"
optional = true

[features]
default = []
web = [
    "dep:askama",
    "dep:eframe",
    "dep:toml",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
android = [
    "dep:toml",
    "dep:eframe",
    "dep:android-activity",
    "dep:jni",
    "dep:winit",
]
build = ["dep:askama", "dep:toml"]
qr = ["functora-core/qr"]
camera = ["qr", "dep:image"]

[dev-dependencies]
tempfile = "3.19.0"

[lints.rust]
unused_results = "warn"
[lints.clippy]
pedantic = "warn"
# strict
or_fun_call = "warn"
must_use_unit = "warn"
ignored_unit_patterns = "warn"
let_underscore_must_use = "warn"
map_unwrap_or = "warn"
unwrap_used = "warn"
expect_used = "warn"
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
# relaxed
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }
