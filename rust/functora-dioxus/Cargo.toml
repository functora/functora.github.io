[package]
name = "functora-dioxus"
license = "MIT"
version = "0.1.0"
edition = "2024"
keywords = ["dioxus", "ui", "web", "utility"]
categories = ["web-programming", "rust-patterns"]
repository = "https://github.com/functora/functora.github.io/tree/master/rust/functora-dioxus"
documentation = "https://docs.rs/functora-dioxus"
description = "Reusable Dioxus components, JS interop, storage, and utilities."

[dependencies]
functora-core = { path = "../functora-core" }
dioxus = { version = "=0.8.0-alpha.1", default-features = false, features = [
  "html",
  "router",
  "launch",
  "logger",
  "lib",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
derive_more = { version = "2.1.0", features = ["display"] }
either = { version = "1.15.0", features = ["serde"] }
tracing = "0.1.43"
functora = { path = "../functora" }
functora-tagged = { path = "../functora-tagged" }
tap = "1.0.1"
zeroize = "1"
dioxus-free-icons = { path = "../dioxus-free-icons", features = [
  "font-awesome-brands",
  "font-awesome-solid",
] }
dioxus-asset-resolver = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-cli-config = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-config-macro = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-config-macros = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-core-macro = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-core-types = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-document = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-history = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-hooks = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-html = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-html-internal-macro = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-interpreter-js = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-logger = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-router = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-router-macro = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-rsx = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-signals = "=0.8.0-alpha.1"
dioxus-stores = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-stores-macro = { version = "=0.8.0-alpha.1", default-features = false }
dioxus-web = { version = "=0.8.0-alpha.1", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Navigator", "Storage", "Location"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["qr"]
qr = ["functora-core/qr"]

[dev-dependencies]
dioxus-free-icons = { path = "../dioxus-free-icons", features = [
  "font-awesome-brands",
  "font-awesome-solid",
] }
tempfile = "3.19.0"
tokio = { version = "1", features = ["rt", "macros"] }
dioxus-core = "=0.8.0-alpha.1"
dioxus-signals = "=0.8.0-alpha.1"
dioxus-document = "=0.8.0-alpha.1"
generational-box = "=0.8.0-alpha.1"

[lints.rust]
unused_results = "warn"
[lints.clippy]
pedantic = "warn"
# strict
or_fun_call = "warn"
must_use_unit = "warn"
ignored_unit_patterns = "warn"
let_underscore_must_use = "warn"
map_unwrap_or = "warn"
unwrap_used = "warn"
expect_used = "warn"
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
# relaxed
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }
