[package]
name = "cryptonote-egui"
version = "0.1.10"
edition = "2024"
description = "Cryptonote is a cross-platform, serverless app for encrypted offline notes - egui edition."
license = "MIT"
keywords = ["egui", "crypto", "notes", "encryption", "offline"]
categories = ["cryptography", "gui"]
repository = "https://github.com/functora/functora.github.io/tree/master/rust/cryptonote-egui"
documentation = "https://docs.rs/cryptonote-egui"
authors = ["Functora <functora@proton.me>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "x11",
    "wayland",
    "android-game-activity",
] }
egui = "0.36.1"
egui_flex = "0.8"
functora-egui = { path = "../functora-egui", features = ["web", "android", "qr", "camera", "router"] }
functora-core = { path = "../functora-core" }
functora = { path = "../functora" }
functora-tagged = { path = "../functora-tagged" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tap = "1.0.1"
urlencoding = "2.1"
form_urlencoded = "1.2"
tracing = "0.1.43"
log = "0.4"
zeroize = "1"
poll-promise = "0.3"
thiserror = "2.0.18"
strum = { version = "0.27", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Location", "Window", "Document", "HtmlCanvasElement", "HtmlVideoElement", "HtmlInputElement", "HtmlAnchorElement", "CanvasRenderingContext2d", "Blob", "BlobPropertyBag", "Url", "FileReader", "FileList", "File", "History", "Storage", "Clipboard", "Navigator", "ShareData", "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "ImageData"] }
js-sys = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["game-activity"] }
jni = "0.21.1"
winit = { version = "0.30.13", default-features = false, features = ["android-game-activity"] }

[package.metadata.functora-egui-web]
title = "Cryptonote"
short_name = "Cryptonote"
theme_color = "#0a0a0a"

[package.metadata.functora-egui-android]
host = "functora.github.io"
path_prefix = "/apps/cryptonote/"
camera = true

[build-dependencies]
askama = "0.12"
functora-egui = { path = "../functora-egui", features = ["build"] }
toml = "0.8"

[patch.crates-io]
egui-winit = { path = "../egui-winit" }

[dev-dependencies]
tempfile = "3.19.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
rxing = { version = "0.9.0", default-features = false, features = ["wasm_support", "encoding_rs", "decoders", "encoders", "qrcode"] }

[lints.rust]
unused_results = "warn"
[lints.clippy]
pedantic = "warn"
# strict
or_fun_call = "warn"
must_use_unit = "warn"
ignored_unit_patterns = "warn"
let_underscore_must_use = "warn"
map_unwrap_or = "warn"
unwrap_used = "warn"
expect_used = "warn"
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
# relaxed
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }
