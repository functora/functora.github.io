[package]
name = "functora-egui"
version = "0.1.0"
edition = "2024"
description = "shadcn/ui-inspired widget library for egui - buttons, inputs, selects, dialogs, and 50+ more components with light/dark theming"
license = "MIT"
keywords = ["egui", "ui", "widgets", "shadcn", "gui"]
categories = ["gui", "rendering"]
repository = "https://github.com/functora/functora.github.io/tree/master/rust/functora-egui"
documentation = "https://docs.rs/functora-egui"

[dependencies]
egui = "0.36.1"
egui_flex = "0.8"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.eframe]
version = "0.36.1"
optional = true
default-features = false
features = ["default_fonts", "glow"]

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2.127"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
optional = true
features = ["Document", "Element", "HtmlCanvasElement", "Location", "VisualViewport", "Window"]

[target.'cfg(target_os = "android")'.dependencies.eframe]
version = "0.36.1"
optional = true
default-features = false
features = ["default_fonts", "glow"]

[target.'cfg(target_os = "android")'.dependencies.android-activity]
version = "0.6.1"
optional = true
features = ["game-activity"]

[target.'cfg(target_os = "android")'.dependencies.jni]
version = "0.21.1"
optional = true

[target.'cfg(target_os = "android")'.dependencies.winit]
version = "0.30.13"
optional = true
default-features = false
features = ["android-game-activity"]

[dependencies.askama]
version = "0.12"
optional = true

[dependencies.toml]
version = "0.8"
optional = true

[features]
default = []
web = [
    "dep:askama",
    "dep:eframe",
    "dep:toml",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
android = [
    "dep:toml",
    "dep:eframe",
    "dep:android-activity",
    "dep:jni",
    "dep:winit",
]
build = ["dep:askama", "dep:toml"]

[lints.clippy]
module_inception = { level = "allow", priority = 1 }
new_without_default = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }