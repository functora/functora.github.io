[package]
name = "functora-dioxus"
license = "MIT"
version = "0.1.0"
edition = "2024"
keywords = ["dioxus", "ui", "web", "utility"]
categories = ["web-programming", "rust-patterns"]
repository = "https://github.com/functora/functora.github.io/tree/master/rust/functora-dioxus"
documentation = "https://docs.rs/functora-dioxus"
description = "Reusable Dioxus components, JS interop, storage, and utilities."

[dependencies]
dioxus = { version = "=0.7.2", features = ["html", "router"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
urlencoding = "2.1.3"
derive_more = { version = "2.1.0", features = ["display"] }
either = { version = "1.15.0", features = ["serde"] }
tracing = "0.1.43"
functora = { path = "../functora" }
functora-tagged = "0.2.7"
tap = "1.0.1"
dioxus-free-icons = { version = "0.10.0", features = [
  "font-awesome-brands",
  "font-awesome-solid",
] }
rxing = { version = "0.9.0", default-features = false, features = [
  "wasm_support",
  "encoding_rs",
  "decoders",
  "encoders",
  "qrcode",
], optional = true }
thiserror = { version = "2.0.18", features = ["std"] }
isolang = { version = "2.3", default-features = false, features = ["serde"] }
sys-locale = "0.3.2"
ammonia = "4.1.2"
pulldown-cmark = "0.13.3"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
getrandom = { version = "0.2", features = ["js"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Navigator", "Storage"] }

[features]
default = ["qr"]
qr = ["dep:rxing"]

[dev-dependencies]
dioxus-free-icons = { version = "0.10.0", features = [
  "font-awesome-brands",
  "font-awesome-solid",
] }
rxing = { version = "0.9.0", default-features = false, features = [
  "wasm_support",
  "encoding_rs",
  "decoders",
  "qrcode",
] }
tempfile = "3.19.0"
tokio = { version = "1", features = ["rt", "macros"] }
dioxus-core = "=0.7.2"
dioxus-signals = "=0.7.2"

[build-dependencies]
isolang = { version = "2.3", default-features = false, features = [
  "list_languages",
] }

[lints.rust]
unused_results = "warn"
[lints.clippy]
pedantic = "warn"
# strict
or_fun_call = "warn"
must_use_unit = "warn"
ignored_unit_patterns = "warn"
let_underscore_must_use = "warn"
map_unwrap_or = "warn"
unwrap_used = "warn"
expect_used = "warn"
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
# relaxed
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }
