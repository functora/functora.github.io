[package]
name = "cryptogram"
version = "0.1.0"
edition = "2024"
description = "End-to-end encrypted Telegram Mini App for group conversations."
license = "MIT"
keywords = ["egui", "telegram", "mls", "encryption", "messaging"]
categories = ["cryptography", "gui", "web-programming"]
homepage = "https://github.com/functora/functora.github.io/tree/master/rust/cryptogram"
repository = "https://github.com/functora/functora.github.io/tree/master/rust/cryptogram"
authors = ["Functora <functora@proton.me>"]
exclude = ["tests/cross_crate_desktop_tests.rs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui = "0.37.0"
functora-egui = { version = "0.4.2", path = "../functora-egui", default-features = false, features = ["web", "android", "desktop", "build", "runtime", "qr", "markdown"] }
functora-core = { version = "0.4.1", path = "../functora-core" }
functora-tagged = { version = "0.2.11", path = "../functora-tagged", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
thiserror = "2.0.18"
zeroize = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10.1"
hkdf = "0.12"
sha2 = "0.10"
getrandom = { version = "0.3", features = ["wasm_js"] }
openmls = { version = "0.9.2", features = ["js"] }
openmls_traits = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = { version = "0.6.0", features = ["clonable"] }
openmls_memory_storage = "0.6.0"
tls_codec = { version = "0.5", features = ["derive", "serde", "mls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["Window", "Location"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "android-game-activity",
    "default_fonts",
    "glow",
    "links",
] }
android-activity = { version = "0.6.1", features = ["game-activity"] }
jni = "0.21.1"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }

[package.metadata.functora-egui-web]
title = "Cryptogram"
short_name = "Cryptogram"
theme_color = "#10131a"

[package.metadata.functora-egui-android]
host = "functora.github.io"
path_prefix = "/apps/cryptogram/"

[package.metadata.functora-egui-desktop]
title = "Cryptogram"
comment = "End-to-end encrypted Telegram Mini App"
description = "Cryptogram is an end-to-end encrypted group messenger built with functora-egui and OpenMLS."
categories = "Utility;Security;"
developer = "Functora"

[build-dependencies]
functora-egui = { version = "0.4.2", path = "../functora-egui", default-features = false, features = ["build"] }

[patch.crates-io]
egui-winit = { path = "../egui-winit" }
openmls_rust_crypto = { path = "vendor/openmls_rust_crypto" }
openmls_basic_credential = { path = "vendor/openmls_basic_credential" }

[profile.dev.package."*"]
debug = "line-tables-only"

[lints.rust]
unused_results = "warn"
[lints.clippy]
pedantic = "warn"
# strict
or_fun_call = "warn"
must_use_unit = "warn"
ignored_unit_patterns = "warn"
let_underscore_must_use = "warn"
map_unwrap_or = "warn"
unwrap_used = "warn"
expect_used = "warn"
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
# relaxed
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }
