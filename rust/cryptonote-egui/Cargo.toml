[package]
name = "cryptonote-egui"
version = "0.1.10"
edition = "2024"
description = "Cryptonote is a cross-platform, serverless app for encrypted offline notes - egui edition."
license = "MIT"
keywords = ["egui", "crypto", "notes", "encryption", "offline"]
categories = ["cryptography", "gui"]
repository = "https://github.com/functora/functora.github.io/tree/master/rust/cryptonote-egui"
documentation = "https://docs.rs/cryptonote-egui"
authors = ["Functora <functora@proton.me>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "x11",
    "wayland",
    "android-game-activity",
] }
egui = "0.36.1"
functora-egui = { path = "../functora-egui", features = ["web", "android", "desktop", "qr", "camera", "images", "markdown"] }
functora-core = { path = "../functora-core" }
functora = { path = "../functora" }
functora-tagged = { path = "../functora-tagged" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tap = "1.0.1"
tracing = "0.1.43"
zeroize = "1"
thiserror = "2.0.18"
strum = { version = "0.27", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.127"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["game-activity"] }
jni = "0.21.1"

[package.metadata.functora-egui-web]
title = "Cryptonote"
short_name = "Cryptonote"
theme_color = "#0a0a0a"

[package.metadata.functora-egui-android]
host = "functora.github.io"
path_prefix = "/apps/cryptonote/"
camera = true
extra_intent_filters = '''
<intent-filter>
    <action android:name="android.intent.action.VIEW" />
    <category android:name="android.intent.category.DEFAULT" />
    <data android:scheme="content" android:mimeType="application/octet-stream" android:pathPattern=".*\.cryptonote" />
    <data android:scheme="file" android:mimeType="application/octet-stream" android:pathPattern=".*\.cryptonote" />
</intent-filter>
<intent-filter>
    <action android:name="android.intent.action.VIEW" />
    <category android:name="android.intent.category.DEFAULT" />
    <data android:scheme="content" android:mimeType="*/*" android:pathPattern=".*\.cryptonote" />
    <data android:scheme="file" android:mimeType="*/*" android:pathPattern=".*\.cryptonote" />
</intent-filter>
'''

[package.metadata.functora-egui-desktop]
title = "Cryptonote"
comment = "Cryptonote is a cross-platform, serverless app for encrypted offline notes."
categories = "Utility;Security;"
mime_types = "application/x-cryptonote;"

[build-dependencies]
askama = "0.12"
functora-egui = { path = "../functora-egui", features = ["build"] }
toml = "0.8"

[patch.crates-io]
egui-winit = { path = "../egui-winit" }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints.rust]
unused_results = "warn"
[lints.clippy]
pedantic = "warn"
# strict
or_fun_call = "warn"
must_use_unit = "warn"
ignored_unit_patterns = "warn"
let_underscore_must_use = "warn"
map_unwrap_or = "warn"
unwrap_used = "warn"
expect_used = "warn"
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
# relaxed
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }
