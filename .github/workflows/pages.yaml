name: pages
on:
  push:
    branches: ["master"]
  # to run this workflow manually
  workflow_dispatch:

permissions:
  # to read the docs
  contents: read
  # to deploy to Pages
  pages: write
  # to verify the deployment source
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without submodules
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs/"
          include-hidden-files: true

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # v5.0.1 plus the retry of the artifact lookup from
        # actions/deploy-pages#455, which is not released yet
        uses: actions/deploy-pages@eb6bb52b57e77a2443b71bd3187996bec22de67a
