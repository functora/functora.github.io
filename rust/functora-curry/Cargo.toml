[package]
name = "functora-curry"
license = "MIT"
version = "0.1.0"
edition = "2024"
keywords = ["rust-patterns"]
categories = ["rust-patterns"]
repository = "https://github.com/functora/functora.github.io/tree/master/rust/functora-curry"
documentation = "https://docs.rs/functora-curry"
description = "Macro-free currying on stable Rust."

[dependencies]

[lints.rust]
unused_results = "warn"
[lints.clippy]
pedantic = "warn"
# strict
or_fun_call = "warn"
must_use_unit = "warn"
ignored_unit_patterns = "warn"
let_underscore_must_use = "warn"
map_unwrap_or = "warn"
unwrap_used = "warn"
expect_used = "warn"
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
# relaxed
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }
