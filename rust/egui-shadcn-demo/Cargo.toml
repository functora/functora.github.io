[package]
name = "egui-shadcn-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Showcase app for egui-shadcn - all layouts, components, widgets and features"
license = "MIT"

[lib]
name = "egui_shadcn_demo"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "x11",
    "wayland",
    "android-game-activity",
] }
egui = "0.36.1"
egui-shadcn = { path = "../egui-shadcn", features = ["web"] }
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3", features = ["Location", "Window"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["game-activity"] }
jni = "0.21.1"
winit = { version = "0.30.13", default-features = false, features = [
    "android-game-activity",
] }

[package.metadata.egui-web]
title = "egui-shadcn Showcase"
short_name = "egui-shadcn"
theme_color = "#0a0a0a"

[build-dependencies]
toml = "0.8"

[patch.crates-io]
egui-winit = { path = "../egui-winit" }

[lints.rust]
unused_results = "warn"
[lints.clippy]
pedantic = "warn"
# strict
or_fun_call = "warn"
must_use_unit = "warn"
ignored_unit_patterns = "warn"
let_underscore_must_use = "warn"
map_unwrap_or = "warn"
unwrap_used = "warn"
expect_used = "warn"
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
# relaxed
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }