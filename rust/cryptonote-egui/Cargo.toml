[package]
name = "cryptonote-egui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "x11",
    "wayland",
    "android-game-activity",
] }
egui = "0.36.1"
functora-core = { path = "../functora-core", features = ["qr"] }
functora-tagged = { path = "../functora-tagged" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tap = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-executor = "0.3"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
arboard = "3"
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "Clipboard",
    "Document",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Navigator",
    "ShareData",
    "Url",
    "Window",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
winit = { version = "0.30.13", default-features = false, features = [
    "android-game-activity",
] }

[dev-dependencies]
functora-core = { path = "../functora-core", features = ["qr"] }

[lints.rust]
unused_results = "warn"
[lints.clippy]
pedantic = "warn"
# strict
or_fun_call = "warn"
must_use_unit = "warn"
ignored_unit_patterns = "warn"
let_underscore_must_use = "warn"
map_unwrap_or = "warn"
unwrap_used = "warn"
expect_used = "warn"
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
# relaxed
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }